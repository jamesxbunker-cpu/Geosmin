<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>Geosmin · Projects</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="site_header.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"
      sizes="any">
  </head>

  <body>

    <!-- ========== STATIC HEADER BAR with TAB OPTIONS ========== -->
    <site-header> </site-header>

    <!-- ===== MAIN CONTENT: Projects page styled like homepage cards ===== -->
    <main class="container">
      <div class="hero">
        <h1>Projects</h1>
        <p>Things I've built, experiments, and ongoing work.</p>
      </div>

      <!-- ===== THIS DIV IS REQUIRED – the script injects projects here ===== -->
      <div id="projectsContainer" class="card-grid">
        <p class="latest-loading">loading projects…</p>
      </div>
    </main>

    <!-- ===== STATIC FOOTER (matching homepage) ===== -->
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 Geosmin · Proudly Canadian 🍁</p>
      </div>
    </footer>

    <script>
    (function () {
      "use strict";

      // ============================================================
      // STEP 1: CONFIGURATION
      // ============================================================
      const project_FOLDER = 'projects';
      const MAX_PROJECTS = 50;

      // Get the container where projects will be displayed
      const container = document.getElementById('projectsContainer');

      // ============================================================
      // STEP 2: LOAD ONE PROJECT FROM ITS FOLDER
      // ============================================================
      function loadProjectFromFolder(folderPath) {
        const fileUrl = folderPath + '/project_index.html';

        return fetch(fileUrl)
          .then(
            function (response) {
              if (!response.ok) {
                return null;
              }
              return response.text();
            }
          )
          .then(
            function (htmlText) {
              if (!htmlText) {
                return null;
              }

              const parser = new DOMParser();
              const document = parser.parseFromString(htmlText, 'text/html');

              function findMeta(name) {
                const metaTag = document.querySelector('meta[name="' + name + '"]');
                if (metaTag) {
                  const content = metaTag.getAttribute('content');
                  if (content) {
                    return content;
                  }
                  else {
                    return '';
                  }
                }
                return '';
              }

              const project = {
                title: findMeta('title') || 'Untitled',
                description: findMeta('description') || '',
                author: findMeta('author') || '',
                date: findMeta('date') || '',
                tags: findMeta('keywords') || '',
                folder: folderPath
              };

              const tagsString = project.tags;
              const tagsArray = tagsString.split(',');
              const cleanedTags = [];

              for (let i = 0; i < tagsArray.length; i++) {
                const cleanTag = tagsArray[i].trim();
                if (cleanTag.length > 0) {
                  cleanedTags.push(cleanTag);
                }
              }
              project.tags = cleanedTags;

              return project;
            }
          )
          .catch(
            function (error) {
              return null;
            }
          );
      }

      // ============================================================
      // STEP 3: LOAD ALL PROJECTS
      // ============================================================
      function loadAllProjects() {
        const loadingTasks = [];

        for (let i = 1; i <= MAX_PROJECTS; i++) {
          const folderPath = project_FOLDER + '/project' + i;

          const task = loadProjectFromFolder(folderPath)
            .then(
              function (project) {
                if (project) {
                  project.index = i;
                  return project;
                }
                return null;
              }
            );

          loadingTasks.push(task);
        }

        return Promise.all(loadingTasks)
          .then(
            function (allProjects) {
              const validProjects = [];
              for (let i = 0; i < allProjects.length; i++) {
                if (allProjects[i] !== null) {
                  validProjects.push(allProjects[i]);
                }
              }

              validProjects.sort(
                function (a, b) {
                  return b.index - a.index;
                }
              );

              return validProjects;
            }
          );
      }

      // ============================================================
      // STEP 4: DISPLAY PROJECTS AS CARDS (matching homepage style)
      // ============================================================
      function displayProjects(projects) {
        // Clear the container
        container.innerHTML = '';

        // If there are no projects, show a message
        if (projects.length === 0) {
          container.innerHTML = '<p class="latest-loading">No projects found. Create projects/project1/project_index.html etc.</p>';
          return;
        }

        // Go through each project and display it as a card
        for (let i = 0; i < projects.length; i++) {
          const project = projects[i];

          // Create the card article element
          const card = document.createElement('article');
          card.className = 'post-card';

          // --- Title (link to the full project) ---
          const titleHeading = document.createElement('h3');
          const titleLink = document.createElement('a');
          titleLink.href = project.folder + '/project_index.html';
          titleLink.textContent = project.title;
          titleLink.style.color = 'inherit';
          titleLink.style.textDecoration = 'none';
          titleHeading.appendChild(titleLink);
          card.appendChild(titleHeading);

          // --- Meta section (author, date) ---
          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';

          if (project.author) {
            const authorSpan = document.createElement('span');
            authorSpan.textContent = '👤 ' + project.author;
            metaDiv.appendChild(authorSpan);
          }

          if (project.date) {
            const dateSpan = document.createElement('span');
            dateSpan.textContent = '📅 ' + project.date;
            metaDiv.appendChild(dateSpan);
          }

          if (metaDiv.children.length > 0) {
            card.appendChild(metaDiv);
          }

          // --- Description ---
          if (project.description) {
            const descPara = document.createElement('p');
            descPara.textContent = project.description;
            card.appendChild(descPara);
          }

          // --- Tags ---
          if (project.tags.length > 0) {
            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'latest-tags';
            tagsContainer.style.marginTop = '0.9rem';

            for (let t = 0; t < project.tags.length; t++) {
              const tagSpan = document.createElement('span');
              tagSpan.className = 'tag';
              tagSpan.textContent = project.tags[t];
              tagsContainer.appendChild(tagSpan);
            }

            card.appendChild(tagsContainer);
          }

          // Add the card to the container
          container.appendChild(card);
        }
      }

      // ============================================================
      // STEP 5: START THE PROCESS
      // ============================================================
      loadAllProjects()
        .then(
          function (projects) {
            displayProjects(projects);
          }
        )
        .catch(
          function (error) {
            container.innerHTML = '<p class="latest-loading">Error: ' + error.message + '</p>';
          }
        );

      // ============================================================
      // HOW TO USE THIS
      // ============================================================
      // 1. Create a folder called "projects" in the same directory
      // 2. Inside "projects", create folders: project1, project2, project3, ...
      // 3. In each folder, put an project_index.html file
      // 4. In the <head> of project_index.html, add these meta tags:
      //    <meta name="title" content="My Project Title">
      //    <meta name="description" content="A short description.">
      //    <meta name="author" content="Your Name">
      //    <meta name="date" content="August 30, 2026">
      //    <meta name="keywords" content="JavaScript, Web, GitHub">
      // 5. The script will automatically find and display all your projects

    })();
  </script>

  </body>

</html>
