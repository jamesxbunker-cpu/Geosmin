<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Geosmin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="site_header.js"></script>

</head>
<body>

  <!-- ========== STATIC HEADER BAR with TAB OPTIONS ========== -->
    <site-header> </site-header>

  <!-- ========== MAIN CONTENT (demo layout) ========== -->
  <main class="container">
    <div class="hero">
      <h1>Welcome to Geosmin</h1>
      <p>This site is currently a work in progress, come back soon!</p>
    </div>

    <!-- example blog cards -->
    <div class="card-grid">
      <article class="post-card">
        <h3>Splash</h3>
        <div class="meta">
          <span> April 14, 2026</span>
          <span> 4 min read</span>
          <span> 12</span>
        </div>
        <p>This is a placeholder post.</p>
        <span class="tag">#first</span>
        <span class="tag" style="margin-left: 6px;">#template</span>
      </article>
    </div>

    <div class="footer-note">
       header stays fixed
      <i style="font-size: 0.3rem; vertical-align: middle; margin: 0 6px;"></i>
      ready for your content
    </div>
  </main>

    <!-- ========== STATIC FOOTER ========== -->
  <footer class="site-footer">
    <div class="footer-inner">
    <p>© 2026 Geosmin. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
