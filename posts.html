<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Geosmin · Posts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <script src="site_header.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any">
  </head>
  <body>

    <!-- ========== STATIC HEADER BAR with TAB OPTIONS ========== -->
    <site-header> </site-header>

    <!-- ===== MAIN CONTENT: Posts page styled like homepage cards ===== -->
    <main class="container">
      <div class="hero">
        <h1>Posts</h1>
        <p>Thoughts, notes, and technical write-ups.</p>
      </div>

      <!-- ===== THIS DIV IS REQUIRED – the script injects posts here ===== -->
      <div id="postsContainer" class="card-grid">
        <p class="latest-loading">loading posts…</p>
      </div>
    </main>

    <!-- ===== STATIC FOOTER (matching homepage) ===== -->
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 Geosmin · Built with care</p>
      </div>
    </footer>

    <script>
    (function() {
      "use strict";

      // ============================================================
      // STEP 1: CONFIGURATION
      // ============================================================
      const post_FOLDER = 'posts';
      const MAX_POSTS = 50;

      // Get the container where posts will be displayed
      const container = document.getElementById('postsContainer');

      // ============================================================
      // STEP 2: LOAD ONE POST FROM ITS FOLDER
      // ============================================================
      function loadPostFromFolder(folderPath) {
        const fileUrl = folderPath + '/post_index.html';
        
        return fetch(fileUrl)
          .then(
            function(response) {
              if (!response.ok) {
                return null;
              }
              return response.text();
            }
          )
          .then(
            function(htmlText) {
              if (!htmlText) {
                return null;
              }
            
              const parser = new DOMParser();
              const document = parser.parseFromString(htmlText, 'text/html');
            
              function findMeta(name) {
                const metaTag = document.querySelector('meta[name="' + name + '"]');
                if (metaTag) {
                  const content = metaTag.getAttribute('content');
                  if (content) {
                    return content;
                  } 
                  else {
                    return '';
                  }
                }
                return '';
              }
            
              const post = {
                title: findMeta('title') || 'Untitled',
                description: findMeta('description') || '',
                author: findMeta('author') || '',
                date: findMeta('date') || '',
                tags: findMeta('keywords') || '',
                folder: folderPath
              };
            
              const tagsString = post.tags;
              const tagsArray = tagsString.split(',');
              const cleanedTags = [];

              for (let i = 0; i < tagsArray.length; i++) {
                const cleanTag = tagsArray[i].trim();
                if (cleanTag.length > 0) {
                  cleanedTags.push(cleanTag);
                }
              }
              post.tags = cleanedTags;
            
              return post;
            }
          )
          .catch(
            function(error) {
              return null;
            }
          );
      }

      // ============================================================
      // STEP 3: LOAD ALL POSTS
      // ============================================================
      function loadAllPosts() {
        const loadingTasks = [];
        
        for (let i = 1; i <= MAX_POSTS; i++) {
          const folderPath = post_FOLDER + '/post' + i;
          
          const task = loadPostFromFolder(folderPath)
            .then(
              function(post) {
                if (post) {
                  post.index = i;
                  return post;
                }
                return null;
              }
          );
          
          loadingTasks.push(task);
        }
        
        return Promise.all(loadingTasks)
          .then(
            function(allPosts) {
              const validPosts = [];
              for (let i = 0; i < allPosts.length; i++) {
                if (allPosts[i] !== null) {
                  validPosts.push(allPosts[i]);
                }
              }
              
              validPosts.sort(
                function(a, b) {
                  return b.index - a.index;
                }
              );
              
              return validPosts;
            }
        );
      }

      // ============================================================
      // STEP 4: DISPLAY POSTS AS CARDS (matching homepage style)
      // ============================================================
      
      function displayPosts(posts) {
        // Clear the container
        container.innerHTML = '';
        
        // If there are no posts, show a message
        if (posts.length === 0) {
          container.innerHTML = '<p class="latest-loading">No posts found. Create posts/post1/post_index.html etc.</p>';
          return;
        }
        
        // Go through each post and display it as a card
        for (let i = 0; i < posts.length; i++) {
          const post = posts[i];
          
          // Create the card article element
          const card = document.createElement('article');
          card.className = 'post-card';
          
          // --- Title (link to the full post) ---
          const titleHeading = document.createElement('h3');
          const titleLink = document.createElement('a');
          titleLink.href = post.folder + '/post_index.html';
          titleLink.textContent = post.title;
          titleLink.style.color = 'inherit';
          titleLink.style.textDecoration = 'none';
          titleHeading.appendChild(titleLink);
          card.appendChild(titleHeading);
          
          // --- Meta section (author, date) ---
          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';
          
          if (post.author) {
            const authorSpan = document.createElement('span');
            authorSpan.textContent = '👤 ' + post.author;
            metaDiv.appendChild(authorSpan);
          }
          
          if (post.date) {
            const dateSpan = document.createElement('span');
            dateSpan.textContent = '📅 ' + post.date;
            metaDiv.appendChild(dateSpan);
          }
          
          if (metaDiv.children.length > 0) {
            card.appendChild(metaDiv);
          }
          
          // --- Description ---
          if (post.description) {
            const descPara = document.createElement('p');
            descPara.textContent = post.description;
            card.appendChild(descPara);
          }
          
          // --- Tags ---
          if (post.tags.length > 0) {
            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'latest-tags';
            tagsContainer.style.marginTop = '0.9rem';
            
            for (let t = 0; t < post.tags.length; t++) {
              const tagSpan = document.createElement('span');
              tagSpan.className = 'tag';
              tagSpan.textContent = post.tags[t];
              tagsContainer.appendChild(tagSpan);
            }
            
            card.appendChild(tagsContainer);
          }
          
          // Add the card to the container
          container.appendChild(card);
        }
      }

      // ============================================================
      // STEP 5: START THE PROCESS
      // ============================================================
      
      loadAllPosts()
        .then(
          function(posts) {
            displayPosts(posts);
          }
        )
        .catch(
          function(error) {
            container.innerHTML = '<p class="latest-loading">Error: ' + error.message + '</p>';
          }
        );

      // ============================================================
      // HOW TO USE THIS
      // ============================================================
      // 1. Create a folder called "posts" in the same directory
      // 2. Inside "posts", create folders: post1, post2, post3, ...
      // 3. In each folder, put an post_index.html file
      // 4. In the <head> of post_index.html, add these meta tags:
      //    <meta name="title" content="My Post Title">
      //    <meta name="description" content="A short description.">
      //    <meta name="author" content="Your Name">
      //    <meta name="date" content="August 30, 2026">
      //    <meta name="keywords" content="JavaScript, Web, GitHub">
      // 5. The script will automatically find and display all your posts

    })();
  </script>
  </body>
</html>
